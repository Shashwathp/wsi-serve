services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    environment:
      REDIS_URL: redis://redis:6379/0
      TILE_ROOT: /srv/data/CRC-VAL-HE-7K
    volumes:
      - ./data:/srv/data:ro
      - ./results:/srv/results
      - ./app:/srv/app
    depends_on:
      redis: {condition: service_healthy}

  worker:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      DEVICE: cpu
      BATCH_SIZE: "16"
      BATCH_WAIT_MS: "200"
      CLAIM_IDLE_MS: "10000"
      HF_HOME: /srv/hf
      OMP_NUM_THREADS: "${OMP:-8}"
      MKL_NUM_THREADS: "${OMP:-8}"
      TORCH_NUM_THREADS: "${OMP:-8}"
    volumes:
      - ./data:/srv/data:ro
      - ./results:/srv/results
      - ./app:/srv/app
      - hf-cache:/srv/hf
    depends_on:
      redis: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v3.1.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.5.1
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    depends_on: [prometheus]

volumes:
  hf-cache:
